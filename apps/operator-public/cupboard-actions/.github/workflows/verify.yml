# Cupboard provenance — reusable workflow (cupboard-release-pipeline-content-trust-2026-09-16, P-010).
#
# WHAT THIS DOES. Computes the canonical tree digest of one `<listing_ref>/`
# directory at the commit that triggered the caller, and asks GitHub to sign a
# Sigstore attestation binding that digest to (this workflow's ref, the caller's
# repository, the commit). The Cupboard Worker can then show a "built by the
# Papercusp workflow" badge on the listing.
#
# WHAT THIS IS NOT. It is NOT a gate and NOT a substitute for the Worker's own
# pin and scan. The Worker fetches the bytes itself, pins them, and scans them
# whether or not an attestation exists (R-6). An accepted attestation only sets
# `verified_by = 'attestation'` — a browse badge. No attestation, or one that
# fails verification, never blocks a publish or an install.
#
# THE DIGEST MUST MATCH THE WORKER BIT FOR BIT. The script below is a verbatim
# port of `canonicalTreeDigest` (libs/generic/artifact-registry) fed by the same
# blob walk the Worker uses (`fetchListingEntries` in apps/operator-public/src/
# content-pin.ts): every `blob` entry whose repo-relative path starts with
# `<listing_ref>/`, sorted by UTF-16 code unit, one `<path>\0<sha>\n` record
# each, SHA-256 over the UTF-8 bytes. A parity test in the Papercusp repo
# (cupboard-actions-digest-parity.test.ts) extracts THIS script and runs it
# against real git repositories, so editing it without editing the Worker fails
# the build.
#
# CALLER (needs the three permissions; nothing else):
#
#   permissions: { contents: read, id-token: write, attestations: write }
#   jobs:
#     attest:
#       uses: Papercusp/cupboard-actions/.github/workflows/verify.yml@v1
#       with: { listing_ref: recipes/my-recipe }
name: cupboard-attest

on:
  workflow_call:
    inputs:
      listing_ref:
        description: Repo-relative directory the listing installs from (the Cupboard listing_ref).
        required: true
        type: string
    outputs:
      tree-digest:
        description: Hex SHA-256 canonical tree digest that was attested.
        value: ${{ jobs.attest.outputs.tree-digest }}
      commit-sha:
        description: The commit the digest was computed at.
        value: ${{ jobs.attest.outputs.commit-sha }}

permissions: {}

jobs:
  attest:
    name: cupboard-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tree-digest: ${{ steps.digest.outputs.digest }}
      commit-sha: ${{ steps.digest.outputs.commit }}
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the canonical tree digest
        id: digest
        env:
          LISTING_REF: ${{ inputs.listing_ref }}
          PREDICATE_PATH: ${{ runner.temp }}/cupboard-predicate.json
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';

          const NUL = String.fromCharCode(0);
          const GIT_OBJECT_ID_RE = /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/;
          const listingRef = process.env.LISTING_REF ?? '';
          if (!listingRef || listingRef.startsWith('/') || listingRef.split('/').includes('..')) {
            throw new Error(`listing_ref must be a repo-relative directory, got ${JSON.stringify(listingRef)}`);
          }
          const prefix = `${listingRef.replace(/\/+$/, '')}/`;

          const git = (...args) => execFileSync('git', args, { maxBuffer: 1 << 28 });
          const commit = git('rev-parse', 'HEAD').toString('utf8').trim();

          // `git ls-tree -r -z` record: `<mode> <type> <sha>\t<path>` NUL-terminated.
          // Only `blob` entries count (a `commit` entry is a submodule and carries no
          // bytes the installer can verify) — exactly the Worker's filter.
          const entries = [];
          for (const record of git('ls-tree', '-r', '-z', commit).toString('utf8').split(NUL)) {
            if (record.length === 0) continue;
            const m = /^(\d+) (\w+) ([0-9a-f]+)\t([\s\S]+)$/.exec(record);
            if (!m) throw new Error(`unparseable ls-tree record ${JSON.stringify(record)}`);
            const [, , type, sha, path] = m;
            if (type !== 'blob' || !path.startsWith(prefix)) continue;
            if (!GIT_OBJECT_ID_RE.test(sha)) throw new Error(`invalid blob sha for ${path}`);
            entries.push({ path, sha });
          }
          if (entries.length === 0) throw new Error(`no blobs under ${prefix} at ${commit}`);

          entries.sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
          const canonical = entries.map((e) => `${e.path}${NUL}${e.sha}\n`).join('');
          const digest = createHash('sha256').update(Buffer.from(canonical, 'utf8')).digest('hex');

          writeFileSync(
            process.env.PREDICATE_PATH,
            JSON.stringify({
              digestAlgorithm: 'papercusp-canonical-tree-digest/v1',
              listingRef: prefix.slice(0, -1),
              commitSha: commit,
              fileCount: entries.length,
            }),
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${digest}\ncommit=${commit}\n`);
          console.log(`tree digest ${digest} (${entries.length} files under ${prefix} at ${commit})`);
          NODE

      - name: Attest the tree digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ github.repository }}/${{ inputs.listing_ref }}
          subject-digest: sha256:${{ steps.digest.outputs.digest }}
          predicate-type: https://github.com/Papercusp/cupboard-actions/predicates/tree-digest/v1
          predicate-path: ${{ runner.temp }}/cupboard-predicate.json
