<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif">
<title id="t">Blueprint operation lifecycle</title><desc id="d">A caller submits with a request key and receives a durable handle pinned to a specification revision. With the handle it reads status and events, sends signals or resumes waits, or requests cancellation. When the executor settles, blueprint:result returns the schema-validated output.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="880" height="360" fill="#ffffff"/><rect x="20" y="110" width="130" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="85.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Caller</text><text x="85.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">HTTP or MCP</text><rect x="220" y="110" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">blueprint:submit</text><text x="300.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">requestKey + input</text><rect x="450" y="110" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="530.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Durable handle</text><text x="530.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">pinned revision</text><rect x="680" y="30" width="170" height="50" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="765.0" y="49.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">status / events</text><text x="765.0" y="67.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">observe</text><rect x="680" y="115" width="170" height="50" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="765.0" y="134.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">signal / resume</text><text x="765.0" y="152.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">steer</text><rect x="680" y="200" width="170" height="50" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="765.0" y="219.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">cancel</text><text x="765.0" y="237.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">request stop</text><rect x="450" y="280" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="530.0" y="304.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Settled</text><text x="530.0" y="322.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">validated output</text><rect x="220" y="280" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="300.0" y="304.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">blueprint:result</text><text x="300.0" y="322.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">state: ready</text><line x1="150" y1="140" x2="218" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="380" y1="140" x2="448" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="414.0" y="134.0" text-anchor="middle" font-size="11" fill="#1e293b">handle</text><line x1="610" y1="130" x2="678" y2="55" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="610" y1="140" x2="678" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="610" y1="150" x2="678" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="530" y1="172" x2="530" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="530.0" y="219.0" text-anchor="middle" font-size="11" fill="#1e293b">executor settles</text><line x1="448" y1="310" x2="382" y2="310" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="310" x2="85" y2="172" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="152.5" y="235.0" text-anchor="middle" font-size="11" fill="#1e293b">output</text></svg>