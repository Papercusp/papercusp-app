# Reference nginx config snippet for the operator's pty WebSocket server.
#
# The operator runs Next.js on :3055 and the pty WS server on :3056 (via
# instrumentation.ts → lib/pty-ws.ts). Browsers connect to the WS at the
# same hostname; nginx must pass the Upgrade handshake through and bump
# proxy_read_timeout high enough that an idle terminal session doesn't
# get cut.
#
# Drop the `location /pty/` block into the same `server { … }` that
# already proxies the operator on :3055.
#
# Set PAPERCUSP_PTY_WS_ORIGINS=operator.example.com to lock the WS
# origin allow-list down on the operator side. (In dev, allowLocalhost
# catches everything; in prod we want to be strict.)

server {
    listen 443 ssl http2;
    server_name operator.example.com;

    # ── Operator HTTP (existing) ───────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── pty WebSocket (new) ────────────────────────────────────────
    # Path /pty/<id> is what apps/operator/app/harness/PiPanel.tsx
    # connects to. We rewrite the upstream to land on :3056's /pty/<id>.
    location /pty/ {
        proxy_pass http://127.0.0.1:3056;

        # Upgrade pass-through. Without these three lines the browser
        # WS connection times out at the proxy layer — same gotcha
        # ttyd/gotty/code-server all document.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward identity for the operator's same-origin check.
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle terminals can sit untouched for a long time. The pty
        # server emits a 15 s SSE-style ping over the WS already, but
        # bumping read_timeout well above the keepalive avoids any
        # marginal-timing drops.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable nginx buffering — WS is full-duplex; buffering would
        # delay tiny frames and undo the latency win.
        proxy_buffering off;
    }
}
