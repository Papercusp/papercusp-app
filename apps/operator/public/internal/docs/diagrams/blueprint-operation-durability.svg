<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif">
<title id="t">Blueprint operation durability</title><desc id="d">Submission writes a durable receipt and target in one transaction, pinned to a content-addressed specification revision. A retried submit with the same request key replays the same handle, including after restart. Control inputs are appended to the event log; program execution runs as a DBOS workflow that replays recorded steps after a crash. Late readers observe current durable state.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/><rect x="20" y="40" width="170" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="70.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">submit(requestKey)</text><rect x="260" y="40" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="360.0" y="64.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Receipt + target</text><text x="360.0" y="82.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">one transaction</text><rect x="530" y="40" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="630.0" y="64.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Pinned spec revision</text><text x="630.0" y="82.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">content-addressed</text><rect x="260" y="160" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="360.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Event log</text><text x="360.0" y="202.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">signals, resumes, cancels</text><rect x="530" y="160" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="630.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">DBOS program workflow</text><text x="630.0" y="202.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">replays recorded steps</text><rect x="20" y="160" width="170" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="105.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Restart / retry</text><text x="105.0" y="202.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">same requestKey</text><rect x="260" y="280" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/><text x="360.0" y="304.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600">Late reader</text><text x="360.0" y="322.0" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#475569">status, events, result</text><line x1="190" y1="70" x2="258" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="460" y1="70" x2="528" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="360" y1="100" x2="360" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="630" y1="100" x2="630" y2="158" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="105" y1="160" x2="258" y2="82" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><text x="181.5" y="115.0" text-anchor="middle" font-size="11" fill="#1e293b">replays same handle</text><line x1="360" y1="220" x2="360" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/><line x1="530" y1="205" x2="462" y2="290" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/></svg>