<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Papercusp looking up at cusp">
  <!-- Big looming cusp -->
  <g stroke="#3a2418" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 32 1 C 32 5 26 9 22 14"/>
    <path d="M 32 1 C 32 5 38 9 42 14"/>
  </g>

  <!-- Cup body -->
  <path d="M 15 18 L 19 54 Q 19 58 32 58 Q 45 58 45 54 L 49 18 Z"
        fill="#fff5e1" stroke="#3a2418" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="32" cy="18" rx="17" ry="3.5" fill="#fff5e1" stroke="#3a2418" stroke-width="2.5"/>
  <ellipse cx="32" cy="18" rx="14.2" ry="2.5" fill="#5b3a1a"/>
  <path d="M 18 32 Q 32 29 46 32" stroke="#d4a373" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows arched up high (curved, raised) -->
  <path d="M 23 35 Q 26.5 32 30 35" stroke="#3a2418" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 34 35 Q 37.5 32 41 35" stroke="#3a2418" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Wide eyes — pupils are at the top (looking up at the cusp) -->
  <circle cx="26.5" cy="42" r="2.6" fill="#fff5e1" stroke="#3a2418" stroke-width="1.2"/>
  <circle cx="37.5" cy="42" r="2.6" fill="#fff5e1" stroke="#3a2418" stroke-width="1.2"/>
  <circle cx="26.5" cy="40.4" r="0.95" fill="#3a2418"/>
  <circle cx="37.5" cy="40.4" r="0.95" fill="#3a2418"/>

  <!-- Smaller O mouth -->
  <ellipse cx="32" cy="49" rx="1.6" ry="2.2" fill="#3a2418"/>
</svg>
