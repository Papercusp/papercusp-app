id: su.practice
extends: base
version: 0.1.1
description: "The SU's reusable additive working practice; its text remains in base/prompts/su.practice.md until the render migration."
slots:
  - slot: practice
contributions:
  - id: su-practice-text
    purpose: prompt
    source: fixed
    refresh: source-change
    inputKind: prompt-file
    ref: base:su.practice
  - id: turn-start-orientation
    purpose: prompt
    source: provider
    refresh: turn
    inputKind: prompt-file
    ref: provider:turn-start-orientation
    producerRef: turn-start-orientation:buildTurnStartOrientationBlock
    availability: optional
  - id: coord-orientation
    purpose: operational
    source: provider
    refresh: on-demand
    inputKind: setting
    ref: coord-orient
    producerRef: agent-tools/coordination/tools/orient:composeOrient
    availability: optional
