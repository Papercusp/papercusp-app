id: su
extends:
  - papercusp-engineer
  - su-collaborator
  - su.practice
version: 0.1.0
visibility: public
description: "Named SU identity composition. Client, fleet assignment and modes are selected separately; this package grants no role or authority."
slots: []
contributions:
  - id: current-mode-state
    purpose: operational
    source: provider
    refresh: turn
    inputKind: setting
    ref: mode
    producerRef: modes/store:agent_modes
  - id: current-assignment
    purpose: operational
    source: provider
    refresh: turn
    inputKind: setting
    ref: assignment
    producerRef: coord:presence
