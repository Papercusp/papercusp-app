# The `su.mode-audit` IDENTITY — identities-v1-2026-08-30 P-021 (D-008 as amended
# 2026-09-03; D-022 §1/§6).
#
# ABSTRACT, like `base`: no workItem/spine, never loaded standalone — a layer in an
# `extends` stack. The `slots:` key is the identity discriminator (D-013): this document
# fills the EXCLUSIVE `audit` mode axis — the DEFINITION of AUDIT mode (the owner's "step
# back and audit the whole picture" posture) in the coding su's vocabulary.
#
# THE ENFORCEMENT IS KERNEL, NOT THIS DOCUMENT'S: AUDIT's read-only-toward-its-subject
# clause is enforced mechanically by `capability-envelope/audit-mode-guard.ts` at the
# dispatch chokepoint from the REGISTRY state; this text may describe the posture, it
# does not create or relax the guard.
#
# Attached by `mode:set { mode:'audit', instructions }` through the ⟦stack⟧ channel;
# `enabled:false` detaches and VOIDS it. Text: `prompts/audit.md`, resolved THROUGH THE
# PROMPT CHAIN.
id: su.mode-audit
extends: base
version: 0.1.0
description: >-
  IDENTITY (abstract — a layer, never runnable alone): the AUDIT mode definition — a
  verdict on a whole program, census → ledger truth → flow → liveness → mechanisms →
  delivered report. Fills the exclusive `audit` mode axis; read-only enforcement stays
  kernel (P-021 / D-008).

slots:
  - slot: audit
contributions:
  - id: audit-definition
    purpose: prompt
    source: fixed
    refresh: source-change
    inputKind: prompt-file
    ref: "mode:su.mode-audit:audit"
  - id: current-mode-state
    purpose: operational
    source: provider
    refresh: turn
    inputKind: setting
    ref: mode
    producerRef: modes/store:agent_modes
mode:
  id: audit
  policyRef: audit
  title: "AUDIT — judge the whole program, not its items"
  oneLiner: "step back and audit an entire program — lifecycle census, ledger truth, flow, liveness, churn mechanisms — and deliver an evidenced verdict instead of an item-by-item status read"
  definitionContributionId: audit-definition
  implies: []
  requiresSubject: false
  launchable: false
