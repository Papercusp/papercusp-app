# The `su.fleet-leader` IDENTITY — identities-v1-2026-08-30 P-020 (D-003 as narrowed by
# D-007, D-022 §5–6).
#
# ABSTRACT, like `base`: no workItem/spine, never loaded standalone — a layer in an
# `extends` stack. The `slots:` key is the identity discriminator (D-013): this
# document fills the EXCLUSIVE `fleet-posture` slot — the LEADER craft (claim
# leadership first, leading ⇒ AUTO + push-first monitoring, fleet:invariant, benching,
# re-read the ledger before remediating, kickoff = mission delta, declare the gate, the
# spawn announcement: account routing · model · carry). "Leading ⇒ AUTO" is stated here
# as craft; should it become a registry implication it moves to the kernel's modes table
# (D-008). The fleet PROTOCOL — claims honoured, gate events, stand-down obeyed,
# completion evidence — is KERNEL and is not in this document.
#
# Attached at `fleet:take-leadership` (and at a `--fleet-name` launch, which creates the
# fleet with the launcher as leader): presence `fleet_role` → control anchor `stack` →
# the ⟦stack⟧ inject-now channel delivers ONE swap payload that names and voids the
# replaced `su.fleet-member` (P-012 / D-022 §2–3); `suSessionBinding({ fleetRole:'leader' })`
# binds it into every FULL render.
#
# Its text is `prompts/fleet-posture.md` — a VERBATIM extraction of the leader tiles of
# `blueprints/base/prompts/su.md`, regenerated by `npm run gen:su-decomposition` and
# drift-checked by `su-decomposition.test.ts` — edit su.md, never the extraction. The su
# stack composer resolves the document THROUGH THE PROMPT CHAIN (`identityRoots`: a
# hive's local / installed tier first, the built-in harness last), so an installed
# override of this identity wins over this file.
id: su.fleet-leader
extends: base
version: 0.1.3
visibility: public
description: >-
  IDENTITY (abstract — a layer, never runnable alone): the fleet LEADER posture — the
  monitoring / benching / claim-spec / kickoff / spawn-announcement craft of leading a
  fleet. Fills the exclusive `fleet-posture` slot with su.md's leader tiles, extracted
  verbatim by P-002 and made an identity by P-020; attached by fleet:take-leadership.

slots:
  - slot: fleet-posture
contributions:
  - id: fleet-leader-brief
    purpose: operational
    source: provider
    refresh: on-demand
    inputKind: setting
    ref: fleet-leader-brief
    producerRef: papercusp.fleet-leader-brief@1
    verb: read
    availability: optional
