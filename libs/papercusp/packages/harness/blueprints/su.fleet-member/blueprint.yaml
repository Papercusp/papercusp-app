# The `su.fleet-member` IDENTITY — identities-v1-2026-08-30 P-020 (D-003 as narrowed by
# D-007, D-022 §5–6).
#
# ABSTRACT, like `base`: no workItem/spine, never loaded standalone — a layer in an
# `extends` stack. The `slots:` key is the identity discriminator (D-013): this
# document fills the EXCLUSIVE `fleet-posture` slot — the MEMBER operating style under
# a fleet leader (wake bootstrap, pull via scheduler:get_next, claim via a wip-flip,
# persist with loop:arm, park on the pool refill, report exceptions to the leader).
# The fleet PROTOCOL it rides on — claims honoured, gate events, stand-down obeyed,
# completion evidence — is KERNEL and is not in this document.
#
# Attached at fleet:launch-on-plan / fleet:join (`suSessionBinding({ fleetRole:'member' })`
# binds it into the FIRST render; presence `fleet_role` → control anchor `stack` → the
# ⟦stack⟧ inject-now channel mid-session); `fleet:take-leadership` SWAPS it for
# `su.fleet-leader` on the same exclusive slot (P-012 / D-022 §2).
#
# Its text is `prompts/fleet-posture.md` — a VERBATIM extraction of the member tiles of
# `blueprints/base/prompts/su.md`, regenerated by `npm run gen:su-decomposition` and
# drift-checked by `su-decomposition.test.ts` — edit su.md, never the extraction. The su
# stack composer resolves the document THROUGH THE PROMPT CHAIN (`identityRoots`: a
# hive's local / installed tier first, the built-in harness last), so an installed
# override of this identity wins over this file.
id: su.fleet-member
extends: base
version: 0.1.2
visibility: public
description: >-
  IDENTITY (abstract — a layer, never runnable alone): the fleet MEMBER posture — how
  an su operates under a fleet leader. Fills the exclusive `fleet-posture` slot with
  su.md's member operating loop, extracted verbatim by P-002 and made an identity by
  P-020; attached by fleet:launch-on-plan / fleet:join.

slots:
  - slot: fleet-posture
