# The `su.mode-ideate` IDENTITY — identities-v1-2026-08-30 P-021 (D-008 as amended
# 2026-09-03; D-022 §1/§6).
#
# ABSTRACT, like `base`: no workItem/spine, never loaded standalone — a layer in an
# `extends` stack. The `slots:` key is the identity discriminator (D-013): this document
# fills the EXCLUSIVE `ideation` mode axis — the DEFINITION of IDEATE mode (the owner's
# "invent net-new, don't just patch" switch) in the coding su's vocabulary, including the
# IDEATE × AUTO composition table. Cross-axis additive: it stacks beside `su.mode-auto`
# (the case a single exclusive `mode` slot would have hard-errored — D-008 amendment).
#
# Kernel keeps the mode STATE, the implication table and the authority semantics (see
# su.mode-auto/blueprint.yaml); this document supplies only how IDEATE reads here.
#
# Attached by `mode:set { mode:'ideate' }` through the ⟦stack⟧ channel; `enabled:false`
# detaches and VOIDS it. Text: `prompts/ideation.md`, resolved THROUGH THE PROMPT CHAIN.
id: su.mode-ideate
extends: base
version: 0.1.0
description: >-
  IDENTITY (abstract — a layer, never runnable alone): the IDEATE mode definition — the
  owner's "invent net-new, don't just patch" switch read in the su's vocabulary. Fills the
  exclusive `ideation` mode axis; stacks with `autonomy` (P-021 / D-008).

slots:
  - slot: ideation
contributions:
  - id: ideate-definition
    purpose: prompt
    source: fixed
    refresh: source-change
    inputKind: prompt-file
    ref: "mode:su.mode-ideate:ideation"
  - id: current-mode-state
    purpose: operational
    source: provider
    refresh: turn
    inputKind: setting
    ref: mode
    producerRef: modes/store:agent_modes
mode:
  id: ideate
  policyRef: ideate
  title: "IDEATE — invent net-new, don’t just patch"
  oneLiner: "run deliberate ideation passes and file net-new feature proposals; with AUTO on, build the strongest"
  definitionContributionId: ideate-definition
  implies: []
  requiresSubject: false
  launchable: false
