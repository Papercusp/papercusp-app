# The `base` blueprint — harness-blueprint-orchestration-2026-06-03 (P-006).
#
# ABSTRACT. Carries only the common knobs/role defaults every concrete blueprint
# shares; it has no workItem/spine of its own and is NEVER loaded standalone
# (BlueprintSchema requires workItem + spine — `base` only ever appears as a
# parent in an `extends` merge). Concrete blueprints (`coding`, `research`, …)
# `extends: base` and supply the runnable shape.
#
# Inheritance/merge semantics (the loader, identities-v1-2026-08-30 P-019): each
# schema leaf composes by the rule `merge-rules.ts` declares for it — by default
# objects deep-merge and arrays/scalars are replaced by the child; declaration
# sets (roles, slots, bundles, grants, reactive, gym.signals, dependencies.*)
# UNION across the stack, and the safety caps (spine.maxTurns, knobs.maxCostUsd,
# parallelWorkers.max/maxFeaturesInFlight, dispatch.costCapUsd/safetyCeiling,
# recursion.maxDepth) take the TIGHTER value regardless of order.
id: base
version: 0.1.0
description: >-
  Abstract base blueprint — common knobs + defaults. Not directly runnable;
  extended by concrete blueprints.

knobs:
  logRetention: 500
  branchIsolation: { enabled: false }
  worktrees: { enabled: false }
  # Doc-integrity primitive (owner 2026-06-22) — the TWIN of git-sync: every harness
  # that `extends: base` inherits doc-drift tracking automatically, so a NEW hive
  # (e.g. from the `coding` blueprint) is doc-honest FROM BIRTH with zero per-hive
  # setup. `track: true` (default) means: at harness:create, SEED the repo's existing
  # docs as tracked records, and let the post-sync freshness sweep self-bootstrap a
  # newly-touched doc. `track: false` opts a harness out. WHERE the docs live is the
  # existing docsRoot resolution — `<repo>/docs`, or a `.papercusp/docs.json` override
  # (e.g. Papercusp points it at apps/operator-docs) — NOT re-declared here. Both the
  # seed and the sweep reuse anchorManualDoc + resolveHarnessDocPaths. Plans:
  # deterministic-commit-workitem-attribution-2026-06-22 +
  # docs-corpus-audit-and-engine-improvements-2026-06-20 (WS2).
  docs:
    track: true

# Declared UI-introspectable tunables (psu-isolation-and-blueprint-aware-harness-ui
# P-006 / D-003 / D-007). The UNIVERSAL params every harness shows, KEYED BY DOT-PATH
# into the per-harness INSTANCE config (the `config.json` namespace the settings panel
# reads + writes — NOT the blueprint-`knobs` namespace). A concrete blueprint ADDS its
# own params (the record UNIONS across `extends` — base ∪ child). The schema-driven
# settings panel (P-008) introspects this, so ANY blueprint — including a Cupboard-
# installed third-party one — gets a working panel for free.
params:
  "parallelWorkers.max":
    label: Max concurrent work items
    type: number
    min: 1
    max: 64
    default: 1
    group: Dispatch
    affects: autoloop — total concurrent work-item slots (overrides dispatch.concurrency)
    description: >-
      How many work items this harness runs in parallel. The orchestrator's imperative
      safety ceiling still clamps this (tighten-only, never a raise).
  "aiBackend.default.model":
    label: Agent model
    type: string
    group: Backend
    affects: every role's agent invocation (the default backend)
    description: >-
      Default model id for this harness's agents (a role can override). e.g.
      claude-opus-5.
  "aiBackend.default.engine":
    label: Agent execution engine
    type: enum
    default: subprocess
    options:
      - value: subprocess
        label: Subprocess CLI
      - value: loop
        label: Papercusp owned loop
    group: Backend
    affects: every role's agent invocation (a role can override)
    description: >-
      Selects the execution engine independently of the provider/backend. The owned
      loop is operator-hosted; subprocess keeps the Claude Code, OMP, or Codex CLI lane.
  "aiBackend.default.agentCmd":
    label: Agent command
    type: string
    group: Backend
    affects: how agents are launched (the default backend)
    description: >-
      The CLI/backend command agents launch with. Do NOT put a secret here — an API
      key belongs in the credential store, never this config.
