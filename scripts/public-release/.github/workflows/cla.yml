# Contributor License Agreement check (open-source-release-2026-09-29 P-011).
#
# Published into Papercusp/papercusp-app by scripts/source-preview.mjs --target public.
# The first pull request from a new contributor gets a comment linking CLA.md; the
# contributor signs by replying with the exact sentence below. Signatures live on the
# `cla-signatures` branch, never on `main` (main is the append-only export lineage).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # pull_request_target runs with a write token; this job checks out NO pull request
        # code, it only reads comments and records signatures.
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
