id: provider-domain
extends: base
version: 1.0.0
slots:
  - slot: domain
knobs:
  aiBackend:
    default:
      model: selected-provider-model
contributions:
  - id: current-brief
    purpose: operational
    source: provider
    refresh: turn
    inputKind: setting
    ref: current-brief
    producerRef: papercusp.mode-state@1
    verb: read
    availability: required
  - id: current-guidance
    purpose: prompt
    source: provider
    refresh: launch
    inputKind: prompt-file
    ref: current-guidance
    producerRef: papercusp.turn-start-orientation@1
    verb: render
    availability: optional
